name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validator tests
        run: python -m unittest discover -s tests -v
      - name: Bundled examples pass the validator
        run: |
          for card in skills/explaining-markets-model-card/references/examples/*.md; do
            python skills/explaining-markets-model-card/scripts/validate_card.py "$card"
          done

  skill-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate against the Agent Skills specification
        # Pinned to a commit (the project publishes no tags) so CI never runs
        # unreviewed upstream code. Bump deliberately.
        run: |
          pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref validate skills/explaining-markets-model-card
